services:
  atomcode2api:
    build: .
    container_name: atomcode2api
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      - API_KEY=${API_KEY}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8788}
      # 凭据文件通过 `-auth` 参数指定，容器内挂载到 /app/data/auth.toml
    volumes:
      - ./data:/app/data
    networks:
      - atomcode2api_net

networks:
  atomcode2api_net:
    driver: bridge
